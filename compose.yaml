name: mi-portafolio-local
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SUPABASE_URL: http://host.docker.internal:54421
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PORT: 4301
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4301/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '4300:4300'
    depends_on:
      backend:
        condition: service_healthy
